name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build web app
        working-directory: apps/web
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          BASE_HREF: /${{ github.event.repository.name }}/
        run: |
          if [ -z "$API_ORIGIN" ]; then
            echo "::error::Set the API_ORIGIN repository variable to the URL of the API on Render."
            exit 1
          fi
          npx ng build --base-href "$BASE_HREF" --define "API_URL='${API_ORIGIN%/}/api'"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist/web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
